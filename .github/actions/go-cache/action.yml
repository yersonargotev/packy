name: Restore verified Go cache
description: Restore Go caches while distinguishing a normal miss from corrupt extraction.

runs:
  using: composite
  steps:
    - name: Resolve Go cache paths
      id: paths
      shell: bash
      run: |
        {
          echo 'value<<EOF'
          go env GOMODCACHE
          go env GOCACHE
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: Look up the exact Go cache
      id: lookup
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.value }}
        key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('**/go.sum') }}
        lookup-only: true

    - name: Restore or schedule the Go cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.value }}
        key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('**/go.sum') }}

    - name: Verify exact Go cache restoration
      shell: bash
      env:
        LOOKUP_HIT: ${{ steps.lookup.outputs.cache-hit }}
        RESTORE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: ./scripts/verify-go-cache-restore.sh "$LOOKUP_HIT" "$RESTORE_HIT"
