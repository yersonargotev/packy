name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * 1'

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Packy-owned code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore verified Go cache
        uses: ./.github/actions/go-cache

      - name: Validate allowlisted Packy-owned code
        run: ./scripts/validate-packy.sh

      - name: Retain exact Vercel foundation evidence
        if: github.event_name == 'pull_request'
        run: |
          ./scripts/validate-vercel-acceptance.sh \
            --evidence-dir "$RUNNER_TEMP/vercel-foundation-evidence" \
            --candidate-sha "$GITHUB_SHA" \
            --run-id "${{ github.run_id }}"

      - name: Upload exact Vercel foundation evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-foundation-qualification
          path: ${{ runner.temp }}/vercel-foundation-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Scan Packy-owned Go code for known vulnerabilities
        continue-on-error: true
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-version-input: ""
          check-latest: false
          cache: false
          go-package: ./...
          repo-checkout: false

  claude-floor-smoke:
    name: Claude 2.1.203 package smoke
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore verified Go cache
        uses: ./.github/actions/go-cache

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run exact-floor package smoke
        run: |
          ./scripts/run-claude-smoke.sh \
            --claude-version 2.1.203 \
            --packy-ref "$GITHUB_SHA" \
            --evidence-dir "$RUNNER_TEMP/claude-floor-evidence" \
            --addy-qualification production \
            --addy-workflow .github/workflows/ci.yml

      - name: Retain exact-floor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-floor-qualification
          path: ${{ runner.temp }}/claude-floor-evidence
          if-no-files-found: error
          retention-days: 90

  claude-vercel-floor-smoke:
    name: Claude 2.1.203 Vercel host smoke
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore verified Go cache
        uses: ./.github/actions/go-cache

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run exact-floor Claude Vercel host smoke
        run: |
          ./scripts/run-claude-vercel-smoke.sh \
            --claude-version 2.1.203 \
            --packy-ref "$GITHUB_SHA" \
            --run-id "${{ github.run_id }}" \
            --evidence-dir "$RUNNER_TEMP/claude-vercel-floor-evidence"

      - name: Retain exact-floor Claude Vercel evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-vercel-floor-qualification
          path: ${{ runner.temp }}/claude-vercel-floor-evidence
          if-no-files-found: error
          retention-days: 90

  codex-floor-smoke:
    name: Codex 0.145.0 package smoke
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore verified Go cache
        uses: ./.github/actions/go-cache

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run exact-floor Codex package smoke
        run: |
          ./scripts/run-codex-smoke.sh \
            --codex-version 0.145.0 \
            --packy-ref "$GITHUB_SHA" \
            --run-id "${{ github.run_id }}" \
            --evidence-dir "$RUNNER_TEMP/codex-floor-evidence"

      - name: Retain exact-floor Codex evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-floor-qualification
          path: ${{ runner.temp }}/codex-floor-evidence
          if-no-files-found: error
          retention-days: 90

  opencode-floor-smoke:
    name: OpenCode 1.18.5 native skill smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore verified Go cache
        uses: ./.github/actions/go-cache

      - name: Run exact OpenCode native skill smoke
        run: |
          ./scripts/run-opencode-smoke.sh \
            --opencode-version 1.18.5 \
            --packy-ref "$GITHUB_SHA" \
            --run-id "${{ github.run_id }}" \
            --evidence-dir "$RUNNER_TEMP/opencode-floor-evidence"

      - name: Retain exact OpenCode evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-floor-qualification
          path: ${{ runner.temp }}/opencode-floor-evidence
          if-no-files-found: error
          retention-days: 90

  vercel-acceptance-gate:
    name: Vercel six-gate acceptance cohort
    needs: [validate, codex-floor-smoke, opencode-floor-smoke, claude-vercel-floor-smoke]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore verified Go cache
        uses: ./.github/actions/go-cache

      - name: Download exact Codex evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-floor-qualification
          path: ${{ runner.temp }}/codex-floor-evidence

      - name: Download exact foundation evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vercel-foundation-qualification
          path: ${{ runner.temp }}/vercel-foundation-evidence

      - name: Download exact OpenCode evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencode-floor-qualification
          path: ${{ runner.temp }}/opencode-floor-evidence

      - name: Download exact Claude evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claude-vercel-floor-qualification
          path: ${{ runner.temp }}/claude-vercel-floor-evidence

      - name: Close the exact six-gate cohort
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          CODEX_RESULT: ${{ needs.codex-floor-smoke.result }}
          OPENCODE_RESULT: ${{ needs.opencode-floor-smoke.result }}
          CLAUDE_RESULT: ${{ needs.claude-vercel-floor-smoke.result }}
        run: |
          mkdir -p "$RUNNER_TEMP/vercel-acceptance"
          ./scripts/gate-vercel-acceptance.sh \
            --candidate-sha "$GITHUB_SHA" \
            --run-id "${{ github.run_id }}" \
            --foundation-evidence "$RUNNER_TEMP/vercel-foundation-evidence" \
            --codex-evidence "$RUNNER_TEMP/codex-floor-evidence/evidence.json" \
            --opencode-evidence "$RUNNER_TEMP/opencode-floor-evidence/evidence.json" \
            --claude-evidence "$RUNNER_TEMP/claude-vercel-floor-evidence/vercel-evidence.json" \
            --output "$RUNNER_TEMP/vercel-acceptance/cohort.json"

      - name: Retain exact Vercel cohort
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-acceptance-pr-${{ github.run_id }}
          path: ${{ runner.temp }}/vercel-acceptance
          if-no-files-found: error
          retention-days: 90
