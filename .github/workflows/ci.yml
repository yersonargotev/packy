name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Packy-owned code
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore verified Go cache
        uses: ./.github/actions/go-cache

      - name: Run CI validation
        run: ./scripts/validate-packy.sh --ci

  release-artifacts:
    name: Stage release contract artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build staged archives
        run: ./scripts/build-release-artifacts.sh --version v0.0.0 --out-dir staged/dist
      - name: Retain staged archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packy-contract-artifacts
          path: staged
          if-no-files-found: error

  release-contracts:
    needs: release-artifacts
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-contracts.yml
    with:
      version: v0.0.0
      bundle: packy-contract-artifacts
