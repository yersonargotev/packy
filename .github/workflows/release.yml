name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  prepare:
    name: Build and validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify version tag is on main
        id: release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$GITHUB_REF" == refs/tags/* && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Validate tagged source
        run: ./scripts/validate-packy.sh --ci
      - name: Build four release archives and SHA256SUMS
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: ./scripts/build-release-artifacts.sh --version "$RELEASE_TAG" --out-dir dist
      - name: Validate checksums, archives, installation, and binary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: ./scripts/validate-release-artifacts.sh --version "$RELEASE_TAG" --dist dist
      - name: Generate matching Homebrew formula and release notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir release-metadata
          ./scripts/generate-homebrew-formula.sh \
            --version "$RELEASE_TAG" \
            --checksums dist/SHA256SUMS \
            --out release-metadata/packy.rb
          sed "s/{{TAG}}/$RELEASE_TAG/g" docs/release-notes/next.md > release-metadata/release-notes.md
      - name: Retain validated release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packy-release-${{ steps.release.outputs.tag }}
          path: |
            dist
            release-metadata
          if-no-files-found: error

  publish:
    name: Publish immutable GitHub Release
    needs: prepare
    if: github.repository == 'yersonargotev/packy' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packy-release-${{ needs.prepare.outputs.tag }}
      - name: Create GitHub Release once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-metadata/release-notes.md

  homebrew:
    name: Publish matching Homebrew formula
    needs: [prepare, publish]
    if: github.repository == 'yersonargotev/packy' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: homebrew
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download validated release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packy-release-${{ needs.prepare.outputs.tag }}
          path: bundle
      - name: Check out Homebrew tap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: yersonargotev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: true
      - name: Commit and push formula
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          install -m 0644 bundle/release-metadata/packy.rb tap/Formula/packy.rb
          git -C tap add Formula/packy.rb
          git -C tap -c user.name=github-actions[bot] \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "packy ${RELEASE_TAG}"
          git -C tap push origin HEAD:main

  package-smoke:
    name: Verify Homebrew installation
    needs: [prepare, homebrew]
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download validated release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packy-release-${{ needs.prepare.outputs.tag }}
          path: bundle
      - name: Install formula and verify installed binary
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          brew install --formula bundle/release-metadata/packy.rb
          [[ "$(packy --version)" == "packy version $RELEASE_TAG" ]]
