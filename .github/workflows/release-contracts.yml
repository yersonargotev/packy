name: Staged release contracts

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      bundle:
        required: true
        type: string

permissions: {}

jobs:
  contracts:
    name: Catalog contract (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin_amd64
            runner: macos-15-intel
          - platform: darwin_arm64
            runner: macos-15
          - platform: linux_amd64
            runner: ubuntu-24.04
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out artifact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go for the contract harness
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download the staged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.bundle }}
      - name: Run the complete executable contract
        env:
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: ./scripts/test-release-contracts.sh --version "$RELEASE_TAG" --dist dist --platform "$RELEASE_PLATFORM" --evidence evidence
      - name: Retain contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-${{ inputs.version }}-${{ matrix.platform }}
          path: evidence
          if-no-files-found: error
