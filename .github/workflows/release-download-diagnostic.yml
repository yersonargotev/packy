name: Release download diagnostic

on:
  push:
    branches:
      - codex/issue-907-release-download
    paths:
      - .github/workflows/release-download-diagnostic.yml

permissions: {}

jobs:
  diagnostic:
    name: Diagnose original bundle download
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out original download client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: actions/download-artifact
          ref: d3f86a106a0bac45b974a628896c90dbdf5c8093
          path: .diagnostic-action
          persist-credentials: false
      - name: Expose the original client diagnostics
        run: |
          set -euo pipefail
          cat > .diagnostic-action/debug.cjs <<'JS'
          const write = process.stdout.write.bind(process.stdout);
          process.stdout.write = (chunk, ...args) => {
            if (typeof chunk === 'string' && /^::debug::(?:Failed to download artifact|response.message: Artifact download failed)/.test(chunk)) {
              chunk = chunk.replace(/^::debug::/, 'artifact-error ').replace(/https?:\/\/\S+/g, '[redacted-url]');
            }
            return write(chunk, ...args);
          };
          console.log(`Diagnostic runtime ${process.version}`);
          require('./dist/index.js');
          JS
          sed -i "s|main: 'dist/index.js'|main: 'debug.cjs'|" .diagnostic-action/action.yml
          grep -Fx "  main: 'debug.cjs'" .diagnostic-action/action.yml
          cat /etc/os-release
          printf 'Runner image %s %s\n' "$ImageOS" "$ImageVersion"
      - name: Download original bundle with original client
        uses: ./.diagnostic-action
        with:
          name: packy-release-v0.2.35
          github-token: ${{ github.token }}
          repository: yersonargotev/packy
          run-id: '41099104580'
          path: original
      - name: Verify retained archive checksums
        run: |
          set -euo pipefail
          cd original/dist
          sha256sum --check SHA256SUMS
