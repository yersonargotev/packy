name: Synchronize pack source
run-name: sync-pack-source / ${{ inputs.pack_id || inputs.source_id }} / ${{ inputs.request_digest }}

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Configured source identifier
        required: true
        type: string
      pack_id:
        description: V3 register_bundle target Pack identifier
        required: false
        type: string
      operation:
        description: Synchronize/register one source or atomically register a source bundle
        required: true
        type: choice
        default: synchronize
        options:
          - synchronize
          - register
          - register_bundle
      registration_json:
        description: Register only; complete strict SourceConfig JSON
        required: false
        type: string
      registration_sha256:
        description: Register only; canonical SourceConfig SHA-256
        required: false
        type: string
      registrations_json:
        description: Register bundle only; ordered registrations and legal evidence JSON
        required: false
        type: string
      registration_bundle_sha256:
        description: Register bundle only; canonical ordered registration bundle SHA-256
        required: false
        type: string
      proposed_version:
        description: Register bundle only; initial Pack generation version
        required: false
        type: string
      proposed_manifest_json:
        description: Register bundle only; canonical initial Pack manifest JSON
        required: false
        type: string
      proposed_manifest_sha256:
        description: Register bundle only; canonical initial Pack manifest SHA-256
        required: false
        type: string
      request_digest:
        description: SHA-256 identity of the canonical request JSON
        required: true
        type: string
      selector:
        description: Candidate selector
        required: true
        type: choice
        options:
          - latest-stable
          - prerelease
          - commit
      selector_ref:
        description: Exact prerelease tag or full commit SHA when required
        required: false
        type: string
      classification_mode:
        description: Explicit classification mode (never falls back)
        required: true
        type: choice
        options:
          - ai
          - human
      request_reason:
        description: Operator reason recorded with the request
        required: true
        type: string
      retry_of_run:
        description: Explicit retry only; prior workflow run ID
        required: false
        type: string
      expected_plan_id:
        description: Human evidence dispatch only; exact inspection plan ID
        required: false
        type: string
      expected_base_sha:
        description: Human evidence dispatch only; exact inspected base SHA
        required: false
        type: string
      human_evidence_json:
        description: Human evidence dispatch only; canonical bound evidence JSON
        required: false
        type: string
      prepare_only:
        description: V3 branch proof only; run through read-only publication preparation without repository writes
        required: false
        type: boolean
        default: false

permissions: {}

# GitHub's concurrency contract keeps the active run, admits one pending run,
# and replaces only an older pending run. A promoted run starts at Inspect and
# therefore performs a fresh Check rather than consuming the superseded plan.
concurrency:
  group: ${{ inputs.prepare_only && format('sync-pack-source-prepare-{0}-{1}', github.ref_name, inputs.pack_id || inputs.source_id) || format('sync-pack-source-{0}', inputs.pack_id || inputs.source_id) }}
  cancel-in-progress: false

jobs:
  admit:
    name: Admit protected publication or read-only preparation
    if: github.repository == 'yersonargotev/packy' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enforce the ref, mode, and operation boundary
        env:
          PACKY_OPERATION: ${{ inputs.operation }}
          PACKY_PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: |
          set -euo pipefail
          if [[ "$PACKY_PREPARE_ONLY" == "true" ]]; then
            [[ "$GITHUB_REF" != "refs/heads/main" ]]
            [[ "$GITHUB_REF" =~ ^refs/heads/(feat|fix|chore)/issue-[0-9]+-[a-z0-9-]+$ ]]
            [[ "$PACKY_OPERATION" == "register_bundle" ]]
          else
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
          fi

  governance-drift:
    name: Verify governance promotion boundary
    needs: admit
    if: github.repository == 'yersonargotev/packy' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.prepare_only == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
      issues: read
    steps:
      - name: Check out protected main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fail closed on current affected drift
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_READ_TOKEN }}
          GH_METADATA_TOKEN: ${{ github.token }}
        run: |
          ./scripts/gate-governance-drift.sh \
            --boundary promotion \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --commit "$GITHUB_SHA" \
            --workflow .github/workflows/sync-pack-source.yml \
            --output-dir "$RUNNER_TEMP/governance-drift"
      - name: Retain promotion gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sync-governance-drift-${{ github.run_id }}
          path: ${{ runner.temp }}/governance-drift/
          if-no-files-found: error
          retention-days: 90

  inspect:
    name: Inspect
    needs: [admit, governance-drift]
    if: ${{ always() && github.repository == 'yersonargotev/packy' && needs.admit.result == 'success' && ((inputs.prepare_only == true && github.ref != 'refs/heads/main' && needs.governance-drift.result == 'skipped') || (inputs.prepare_only == false && github.ref == 'refs/heads/main' && needs.governance-drift.result == 'success')) }}
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.route.outputs.continue }}
      noop: ${{ steps.route.outputs.noop }}
    permissions:
      contents: read
    steps:
      - name: Initialize fail-closed operational artifact
        env:
          PACKY_SOURCE_ID: ${{ inputs.source_id }}
          PACKY_OPERATION: ${{ inputs.operation }}
          PACKY_PACK_ID: ${{ inputs.pack_id }}
          PACKY_REGISTRATIONS_JSON: ${{ inputs.registrations_json }}
          PACKY_REGISTRATION_BUNDLE_SHA256: ${{ inputs.registration_bundle_sha256 }}
          PACKY_PROPOSED_VERSION: ${{ inputs.proposed_version }}
          PACKY_PROPOSED_MANIFEST_SHA256: ${{ inputs.proposed_manifest_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/packy-sync/inspect"
          if [[ "$PACKY_OPERATION" == "register_bundle" ]]; then
            members="$(jq -c '[.[] | {
              source_id: .registration.id,
              candidate_sha: .registration.selector.ref,
              legal_evidence_ref: .legal_admission.evidence_reference,
              legal_evidence_sha256: .legal_admission.evidence_sha256
            }]' <<<"$PACKY_REGISTRATIONS_JSON")"
            source_ids="$(jq -c '[.[].source_id]' <<<"$members")"
            jq -n --arg pack_id "$PACKY_PACK_ID" --argjson source_ids "$source_ids" \
              --arg registration_bundle_sha256 "$PACKY_REGISTRATION_BUNDLE_SHA256" \
              --arg proposed_version "$PACKY_PROPOSED_VERSION" \
              --arg proposed_manifest_sha256 "$PACKY_PROPOSED_MANIFEST_SHA256" \
              --argjson members "$members" \
              '{schema_version:3,state:"blocked",pack_id:$pack_id,source_ids:$source_ids,
                registration_bundle_sha256:$registration_bundle_sha256,
                proposed_version:$proposed_version,proposed_manifest_sha256:$proposed_manifest_sha256,
                members:$members,blockers:["The Inspect job ended before a canonical result was produced."],
                recovery:["Start a fresh complete bundle dispatch after checking the failed job."],
                contains_secrets:false,contains_upstream_bytes:false}' \
              > "$RUNNER_TEMP/packy-sync/inspect/operational-artifact.json"
            exit 0
          fi
          source_id="$PACKY_SOURCE_ID"
          [[ "$source_id" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]] || source_id=unknown
          jq -n --arg source_id "$source_id" '{schema_version:1,state:"blocked",source_id:$source_id,blockers:["The Inspect job ended before a canonical result was produced."],recovery:["Start a fresh manual dispatch after checking the failed job."],contains_secrets:false,contains_upstream_bytes:false}' > "$RUNNER_TEMP/packy-sync/inspect/operational-artifact.json"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check out protected main as the preparation sandbox
        if: inputs.prepare_only == true
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          path: packy-main
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect with a fresh canonical Check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKY_SOURCE_ID: ${{ inputs.source_id }}
          PACKY_PACK_ID: ${{ inputs.pack_id }}
          PACKY_OPERATION: ${{ inputs.operation }}
          PACKY_REGISTRATION_JSON: ${{ inputs.registration_json }}
          PACKY_REGISTRATION_SHA256: ${{ inputs.registration_sha256 }}
          PACKY_REGISTRATIONS_JSON: ${{ inputs.registrations_json }}
          PACKY_REGISTRATION_BUNDLE_SHA256: ${{ inputs.registration_bundle_sha256 }}
          PACKY_PROPOSED_VERSION: ${{ inputs.proposed_version }}
          PACKY_PROPOSED_MANIFEST_JSON: ${{ inputs.proposed_manifest_json }}
          PACKY_PROPOSED_MANIFEST_SHA256: ${{ inputs.proposed_manifest_sha256 }}
          PACKY_SELECTOR: ${{ inputs.selector }}
          PACKY_SELECTOR_REF: ${{ inputs.selector_ref }}
          PACKY_CLASSIFICATION_MODE: ${{ inputs.classification_mode }}
          PACKY_REQUEST_REASON: ${{ inputs.request_reason }}
          PACKY_REQUEST_DIGEST: ${{ inputs.request_digest }}
          PACKY_RETRY_OF_RUN: ${{ inputs.retry_of_run }}
          PACKY_EXPECTED_PLAN_ID: ${{ inputs.expected_plan_id }}
          PACKY_EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          PACKY_HUMAN_EVIDENCE_JSON: ${{ inputs.human_evidence_json }}
          PACKY_PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: |
          export HOME="$RUNNER_TEMP/packy-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/packy-xdg"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$RUNNER_TEMP/packy-sync/inspect"
          repository_root="$GITHUB_WORKSPACE"
          syncpacksource=(go run ./internal/tools/syncpacksource)
          if [[ "$PACKY_PREPARE_ONLY" == "true" ]]; then
            go build -o "$RUNNER_TEMP/syncpacksource" ./internal/tools/syncpacksource
            syncpacksource=("$RUNNER_TEMP/syncpacksource")
            repository_root="$GITHUB_WORKSPACE/packy-main"
          fi
          "${syncpacksource[@]}" --phase inspect \
            --repository-root "$repository_root" \
            --output "$RUNNER_TEMP/packy-sync/inspect"
      - name: Route the sealed inspection result
        id: route
        run: |
          status="$(jq -r .status "$RUNNER_TEMP/packy-sync/inspect/plan.json")"
          mode="$(jq -r .classification_mode "$RUNNER_TEMP/packy-sync/inspect/request.json")"
          human_evidence="$(jq -r 'has("human_evidence")' "$RUNNER_TEMP/packy-sync/inspect/request.json")"
          if [[ "$status" == "review-required" && ( "$mode" != "human" || "$human_evidence" == "true" ) ]]; then
            echo "continue=true" >> "$GITHUB_OUTPUT"
          else
            echo "continue=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$status" == "no-op" ]]; then
            echo "noop=true" >> "$GITHUB_OUTPUT"
          else
            echo "noop=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload sealed inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pack-source-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/inspect/
          if-no-files-found: error
          retention-days: ${{ inputs.prepare_only && 30 || 1 }}
      - name: Upload canonical no-op result
        if: ${{ steps.route.outputs.noop == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pack-source-noop-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/inspect/no-op.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload pre-publication operational artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pack-source-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/inspect/operational-artifact.json
          if-no-files-found: error
          retention-days: 30

  classify:
    name: Classify
    needs: inspect
    if: ${{ always() && needs.inspect.result == 'success' && needs.inspect.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    steps:
      - name: Initialize fail-closed operational artifact
        env:
          PACKY_SOURCE_ID: ${{ inputs.source_id }}
          PACKY_OPERATION: ${{ inputs.operation }}
          PACKY_PACK_ID: ${{ inputs.pack_id }}
          PACKY_REGISTRATIONS_JSON: ${{ inputs.registrations_json }}
          PACKY_REGISTRATION_BUNDLE_SHA256: ${{ inputs.registration_bundle_sha256 }}
          PACKY_PROPOSED_VERSION: ${{ inputs.proposed_version }}
          PACKY_PROPOSED_MANIFEST_SHA256: ${{ inputs.proposed_manifest_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/packy-sync/classification"
          if [[ "$PACKY_OPERATION" == "register_bundle" ]]; then
            members="$(jq -c '[.[] | {source_id:.registration.id,candidate_sha:.registration.selector.ref,legal_evidence_ref:.legal_admission.evidence_reference,legal_evidence_sha256:.legal_admission.evidence_sha256}]' <<<"$PACKY_REGISTRATIONS_JSON")"
            source_ids="$(jq -c '[.[].source_id]' <<<"$members")"
            jq -n --arg pack_id "$PACKY_PACK_ID" --argjson source_ids "$source_ids" --arg registration_bundle_sha256 "$PACKY_REGISTRATION_BUNDLE_SHA256" --arg proposed_version "$PACKY_PROPOSED_VERSION" --arg proposed_manifest_sha256 "$PACKY_PROPOSED_MANIFEST_SHA256" --argjson members "$members" \
              '{schema_version:3,state:"blocked",pack_id:$pack_id,source_ids:$source_ids,registration_bundle_sha256:$registration_bundle_sha256,proposed_version:$proposed_version,proposed_manifest_sha256:$proposed_manifest_sha256,members:$members,blockers:["The Classify job ended before canonical evidence was produced."],recovery:["Start a fresh complete bundle dispatch; do not reuse partial or member-level classification."],contains_secrets:false,contains_upstream_bytes:false}' > "$RUNNER_TEMP/packy-sync/classification/operational-artifact.json"
            exit 0
          fi
          jq -n --arg source_id "$PACKY_SOURCE_ID" '{schema_version:1,state:"blocked",source_id:$source_id,blockers:["The Classify job ended before canonical evidence was produced."],recovery:["Start a fresh dispatch for the exact sealed candidate; do not fall back between AI and human classification."],contains_secrets:false,contains_upstream_bytes:false}' > "$RUNNER_TEMP/packy-sync/classification/operational-artifact.json"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check out protected main as the preparation sandbox
        if: inputs.prepare_only == true
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          path: packy-main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pack-source-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/inspect
      - name: Classify the sealed Check plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKY_CLASSIFICATION_MODE: ${{ inputs.classification_mode }}
          PACKY_PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: |
          export HOME="$RUNNER_TEMP/packy-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/packy-xdg"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          repository_root="$GITHUB_WORKSPACE"
          syncpacksource=(go run ./internal/tools/syncpacksource)
          if [[ "$PACKY_PREPARE_ONLY" == "true" ]]; then
            go build -o "$RUNNER_TEMP/syncpacksource" ./internal/tools/syncpacksource
            syncpacksource=("$RUNNER_TEMP/syncpacksource")
            repository_root="$GITHUB_WORKSPACE/packy-main"
          fi
          "${syncpacksource[@]}" --phase classify \
            --repository-root "$repository_root" \
            --request "$RUNNER_TEMP/packy-sync/inspect/request.json" \
            --plan "$RUNNER_TEMP/packy-sync/inspect/plan.json" \
            --output "$RUNNER_TEMP/packy-sync/classification"
      - name: Upload classified plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pack-source-classification-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/classification/
          if-no-files-found: error
          retention-days: ${{ inputs.prepare_only && 30 || 1 }}
      - name: Upload pre-publication operational artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pack-source-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/classification/operational-artifact.json
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Validate sandbox
    needs: [inspect, classify]
    if: ${{ always() && needs.inspect.result == 'success' && needs.classify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Initialize fail-closed operational artifact
        env:
          PACKY_SOURCE_ID: ${{ inputs.source_id }}
          PACKY_OPERATION: ${{ inputs.operation }}
          PACKY_PACK_ID: ${{ inputs.pack_id }}
          PACKY_REGISTRATIONS_JSON: ${{ inputs.registrations_json }}
          PACKY_REGISTRATION_BUNDLE_SHA256: ${{ inputs.registration_bundle_sha256 }}
          PACKY_PROPOSED_VERSION: ${{ inputs.proposed_version }}
          PACKY_PROPOSED_MANIFEST_SHA256: ${{ inputs.proposed_manifest_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/packy-sync/validation"
          if [[ "$PACKY_OPERATION" == "register_bundle" ]]; then
            members="$(jq -c '[.[] | {source_id:.registration.id,candidate_sha:.registration.selector.ref,legal_evidence_ref:.legal_admission.evidence_reference,legal_evidence_sha256:.legal_admission.evidence_sha256}]' <<<"$PACKY_REGISTRATIONS_JSON")"
            source_ids="$(jq -c '[.[].source_id]' <<<"$members")"
            jq -n --arg pack_id "$PACKY_PACK_ID" --argjson source_ids "$source_ids" --arg registration_bundle_sha256 "$PACKY_REGISTRATION_BUNDLE_SHA256" --arg proposed_version "$PACKY_PROPOSED_VERSION" --arg proposed_manifest_sha256 "$PACKY_PROPOSED_MANIFEST_SHA256" --argjson members "$members" \
              '{schema_version:3,state:"blocked",pack_id:$pack_id,source_ids:$source_ids,registration_bundle_sha256:$registration_bundle_sha256,proposed_version:$proposed_version,proposed_manifest_sha256:$proposed_manifest_sha256,members:$members,blockers:["The complete-set Apply or Packy validation suite did not finish."],recovery:["Inspect the validation evidence, correct the complete bundle, and start a fresh Inspect."],contains_secrets:false,contains_upstream_bytes:false}' > "$RUNNER_TEMP/packy-sync/validation/operational-artifact.json"
            exit 0
          fi
          jq -n --arg source_id "$PACKY_SOURCE_ID" '{schema_version:1,state:"blocked",source_id:$source_id,blockers:["The sandbox Apply or complete Packy-owned validation suite did not finish."],recovery:["Inspect the validation logs, correct the implementation separately if needed, and start a fresh dispatch."],contains_secrets:false,contains_upstream_bytes:false}' > "$RUNNER_TEMP/packy-sync/validation/operational-artifact.json"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check out protected main as the preparation sandbox
        if: inputs.prepare_only == true
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          path: packy-main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pack-source-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/inspect
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pack-source-classification-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/classification
      - name: Apply in sandbox and run the complete Packy-owned suite
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKY_PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: |
          export HOME="$RUNNER_TEMP/packy-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/packy-xdg"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          repository_root="$GITHUB_WORKSPACE"
          syncpacksource=(go run ./internal/tools/syncpacksource)
          if [[ "$PACKY_PREPARE_ONLY" == "true" ]]; then
            go build -o "$RUNNER_TEMP/syncpacksource" ./internal/tools/syncpacksource
            syncpacksource=("$RUNNER_TEMP/syncpacksource")
            repository_root="$GITHUB_WORKSPACE/packy-main"
          fi
          evidence="$RUNNER_TEMP/packy-sync/classification/classification.json"
          if jq -e '.schema_version == 3' "$RUNNER_TEMP/packy-sync/inspect/request.json" >/dev/null; then
            evidence="$RUNNER_TEMP/packy-sync/classification/classification-evidence.json"
          fi
          "${syncpacksource[@]}" --phase validate \
            --repository-root "$repository_root" \
            --request "$RUNNER_TEMP/packy-sync/inspect/request.json" \
            --plan "$RUNNER_TEMP/packy-sync/inspect/plan.json" \
            --evidence "$evidence" \
            --output "$RUNNER_TEMP/packy-sync/validation"
      - name: Upload sandbox validation proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pack-source-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/validation/validation.json
          if-no-files-found: error
          retention-days: ${{ inputs.prepare_only && 30 || 1 }}
      - name: Upload validation failure artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pack-source-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/validation/operational-artifact.json
          if-no-files-found: error
          retention-days: 30

  prepare:
    name: Prepare publication without writes
    needs: [inspect, classify, validate]
    if: ${{ always() && inputs.prepare_only == true && github.ref != 'refs/heads/main' && needs.inspect.result == 'success' && needs.classify.result == 'success' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Initialize fail-closed preparation artifact
        env:
          PACKY_PACK_ID: ${{ inputs.pack_id }}
          PACKY_REGISTRATIONS_JSON: ${{ inputs.registrations_json }}
          PACKY_REGISTRATION_BUNDLE_SHA256: ${{ inputs.registration_bundle_sha256 }}
          PACKY_PROPOSED_VERSION: ${{ inputs.proposed_version }}
          PACKY_PROPOSED_MANIFEST_SHA256: ${{ inputs.proposed_manifest_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packy-sync/preparation"
          members="$(jq -c '[.[] | {source_id:.registration.id,candidate_sha:.registration.selector.ref,legal_evidence_ref:.legal_admission.evidence_reference,legal_evidence_sha256:.legal_admission.evidence_sha256}]' <<<"$PACKY_REGISTRATIONS_JSON")"
          source_ids="$(jq -c '[.[].source_id]' <<<"$members")"
          jq -n --arg pack_id "$PACKY_PACK_ID" --argjson source_ids "$source_ids" \
            --arg registration_bundle_sha256 "$PACKY_REGISTRATION_BUNDLE_SHA256" \
            --arg proposed_version "$PACKY_PROPOSED_VERSION" \
            --arg proposed_manifest_sha256 "$PACKY_PROPOSED_MANIFEST_SHA256" --argjson members "$members" \
            '{schema_version:3,state:"blocked",pack_id:$pack_id,source_ids:$source_ids,
              registration_bundle_sha256:$registration_bundle_sha256,
              proposed_version:$proposed_version,proposed_manifest_sha256:$proposed_manifest_sha256,
              members:$members,blockers:["Read-only publication preparation did not finish."],
              recovery:["Correct the branch implementation before merge, then start a fresh preparation-only dispatch."],
              contains_secrets:false,contains_upstream_bytes:false}' \
            > "$RUNNER_TEMP/packy-sync/preparation/operational-artifact.json"
      - name: Check out issue-branch tool bytes
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check out protected main as the preparation sandbox
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          path: packy-main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pack-source-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/inspect
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pack-source-classification-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/classification
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pack-source-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/validation
      - name: Reacquire, Apply, validate, construct, and observe without writing
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/packy-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/packy-xdg"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          go build -o "$RUNNER_TEMP/syncpacksource" ./internal/tools/syncpacksource
          "$RUNNER_TEMP/syncpacksource" --phase prepare \
            --repository-root "$GITHUB_WORKSPACE/packy-main" \
            --request "$RUNNER_TEMP/packy-sync/inspect/request.json" \
            --plan "$RUNNER_TEMP/packy-sync/inspect/plan.json" \
            --evidence "$RUNNER_TEMP/packy-sync/classification/classification-evidence.json" \
            --validation "$RUNNER_TEMP/packy-sync/validation/validation.json" \
            --output "$RUNNER_TEMP/packy-sync/preparation"
      - name: Upload read-only preparation proof
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pack-source-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/preparation/preparation.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload preparation failure artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pack-source-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/preparation/operational-artifact.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish
    needs: [inspect, classify, validate]
    if: github.repository == 'yersonargotev/packy' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.prepare_only == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Initialize fail-closed operational artifact
        env:
          PACKY_SOURCE_ID: ${{ inputs.source_id }}
          PACKY_OPERATION: ${{ inputs.operation }}
          PACKY_PACK_ID: ${{ inputs.pack_id }}
          PACKY_REGISTRATIONS_JSON: ${{ inputs.registrations_json }}
          PACKY_REGISTRATION_BUNDLE_SHA256: ${{ inputs.registration_bundle_sha256 }}
          PACKY_PROPOSED_VERSION: ${{ inputs.proposed_version }}
          PACKY_PROPOSED_MANIFEST_SHA256: ${{ inputs.proposed_manifest_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/packy-sync/publication"
          if [[ "$PACKY_OPERATION" == "register_bundle" ]]; then
            members="$(jq -c '[.[] | {source_id:.registration.id,candidate_sha:.registration.selector.ref,legal_evidence_ref:.legal_admission.evidence_reference,legal_evidence_sha256:.legal_admission.evidence_sha256}]' <<<"$PACKY_REGISTRATIONS_JSON")"
            source_ids="$(jq -c '[.[].source_id]' <<<"$members")"
            jq -n --arg pack_id "$PACKY_PACK_ID" --argjson source_ids "$source_ids" --arg registration_bundle_sha256 "$PACKY_REGISTRATION_BUNDLE_SHA256" --arg proposed_version "$PACKY_PROPOSED_VERSION" --arg proposed_manifest_sha256 "$PACKY_PROPOSED_MANIFEST_SHA256" --argjson members "$members" \
              '{schema_version:3,state:"blocked",pack_id:$pack_id,source_ids:$source_ids,registration_bundle_sha256:$registration_bundle_sha256,proposed_version:$proposed_version,proposed_manifest_sha256:$proposed_manifest_sha256,members:$members,blockers:["The Publish job ended before exact Pack-scoped publication state was established."],recovery:["Inspect the stable Pack branch and pull request; preserve reviewer work and start a fresh Inspect."],contains_secrets:false,contains_upstream_bytes:false}' > "$RUNNER_TEMP/packy-sync/publication/operational-artifact.json"
            exit 0
          fi
          jq -n --arg source_id "$PACKY_SOURCE_ID" '{schema_version:1,state:"blocked",source_id:$source_id,blockers:["The Publish job ended before exact publication state was established."],recovery:["Inspect the stable branch and pull request; preserve reviewer work and start a fresh Check."],contains_secrets:false,contains_upstream_bytes:false}' > "$RUNNER_TEMP/packy-sync/publication/operational-artifact.json"
      # This reviewed publication checkout persists only the job-scoped token
      # used after the ownership and exact-state admission checks pass.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pack-source-classification-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/classification
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pack-source-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/inspect
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pack-source-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/validation
      - name: Reacquire, Apply, validate, reobserve, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export HOME="$RUNNER_TEMP/packy-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/packy-xdg"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          evidence="$RUNNER_TEMP/packy-sync/classification/classification.json"
          if jq -e '.schema_version == 3' "$RUNNER_TEMP/packy-sync/inspect/request.json" >/dev/null; then
            evidence="$RUNNER_TEMP/packy-sync/classification/classification-evidence.json"
          fi
          go run ./internal/tools/syncpacksource --phase publish \
            --repository-root "$GITHUB_WORKSPACE" \
            --request "$RUNNER_TEMP/packy-sync/inspect/request.json" \
            --plan "$RUNNER_TEMP/packy-sync/inspect/plan.json" \
            --evidence "$evidence" \
            --validation "$RUNNER_TEMP/packy-sync/validation/validation.json" \
            --output "$RUNNER_TEMP/packy-sync/publication"
      - name: Bind the canonical automation run to the exact proposal
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          head_sha="$(jq -r '.head_sha' "$RUNNER_TEMP/packy-sync/publication/publication.json")"
          pr_number="$(jq -r '.pr_number' "$RUNNER_TEMP/packy-sync/publication/publication.json")"
          printf '<!-- packy-canonical-automation\nrun: %s\nhead: %s\n-->\n' "$RUN_URL" "$head_sha" \
            >"$RUNNER_TEMP/packy-sync/publication/automation-binding.md"
          gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/packy-sync/publication/automation-binding.md"
      - name: Upload operational artifact on publication block
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pack-source-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/packy-sync/publication/operational-artifact.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload canonical publication result
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pack-source-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/packy-sync/publication/publication.json
            ${{ runner.temp }}/packy-sync/publication/proposal-brief.json
            ${{ runner.temp }}/packy-sync/publication/proposal-brief.md
          if-no-files-found: error
          retention-days: 30
